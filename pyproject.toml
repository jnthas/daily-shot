[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-shot"
version = "0.1.0"
description = "Automated solar sunset 12MP USB UVC camera capture, resumable Google Drive backup, local Web UI, and Bluesky publisher/DM monitor."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Pillow>=9.4.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
daily-shot = "daily_shot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
